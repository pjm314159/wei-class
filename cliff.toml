# git-cliff 配置：从 Conventional Commits 自动生成 CHANGELOG 与 Release 说明。
# 手动运行：git cliff -o CHANGELOG.md；CI 中由 release.yml / changelog.yml 调用。

[changelog]
header = """
# Changelog

本项目的全部重要变更记录于此文件。

格式基于 [Keep a Changelog](https://keepachangelog.com/zh-CN/1.1.0/)，
版本号遵循 [SemVer 2.0.0](https://semver.org/)。
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}\
{% else %}\
    ## [未发布]\
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}\
    \n### {{ group | upper_first }}\
    {% for commit in commits %}\
        \n- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {{ commit.message | upper_first }}\
            ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/pjm314159/wei-class/commit/{{ commit.id }}))\
    {% endfor %}\
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"

commit_parsers = [
    { message = "^feat", group = "新功能" },
    { message = "^fix", group = "缺陷修复" },
    { message = "^perf", group = "性能优化" },
    { message = "^refactor", group = "重构" },
    { message = "^test", group = "测试" },
    { message = "^doc", group = "文档" },
    { message = "^build", group = "构建" },
    { message = "^ci", group = "CI" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "杂项" },
    { message = ".*", group = "其他" },
]

commit_preprocessors = [
    # 去掉提交信息中的签名与作者署名尾注
    { pattern = '\(co-authored-by\).*', replace = "" },
]
