name: Changelog

# 合并到 main 或推送 tag 后，自动用 git-cliff 更新 CHANGELOG.md；
# 有变化时自动创建/更新一个 PR，由人工合并回 main（rulesets 要求走 PR）。

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install git-cliff
        run: npm install --global git-cliff@2

      - name: Generate changelog
        run: git cliff -o CHANGELOG.md

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/changelog-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add CHANGELOG.md
          git commit -m "docs(changelog): 更新变更日志 [skip ci]"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "docs(changelog): 更新变更日志" \
            --body "由 git-cliff 自动生成的 CHANGELOG.md 更新，请审阅后合并。"
