name: Changelog

# 合并到 main 或推送 tag 后，自动用 git-cliff 生成完整 CHANGELOG：
# 在 workflow 的 Summary 页面查看，并作为 artifact 供下载。
# 仓库内的 CHANGELOG.md 由发版 PR 携带更新（本地运行 `git cliff -o CHANGELOG.md`），
# 不由 CI 直接回写（main 受 rulesets 保护，且禁止 Actions bot 创建 PR）。

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install git-cliff
        run: npm install --global git-cliff@2

      - name: Generate changelog
        run: git cliff -o CHANGELOG.md

      - name: Show changelog in job summary
        shell: bash
        run: cat CHANGELOG.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHANGELOG
          path: CHANGELOG.md
