name: Release

# 发版流程（docs/GIT.md）：dev → main 的 PR 合并后在 main 打 tag（vX.Y.Z），
# 本 workflow 自动构建各平台预编译二进制并上传到 GitHub Release，
# 供不使用 Docker/nginx 的用户本地部署直接下载。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: wei-class-x86_64-windows.zip
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: wei-class-x86_64-linux.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/wei-class.exe" dist/
          Copy-Item .env.example dist/
          Copy-Item README.md dist/
          Compress-Archive -Path "dist/*" -DestinationPath "dist/${{ matrix.archive }}"

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/wei-class" dist/
          cp .env.example README.md dist/
          tar -czf "dist/${{ matrix.archive }}" -C dist wei-class .env.example README.md

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}" || true
          gh release upload "${GITHUB_REF_NAME}" "dist/${{ matrix.archive }}" --clobber
