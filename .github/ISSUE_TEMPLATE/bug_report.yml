name: Bug 报告
description: 报告功能缺陷或不符合预期的行为
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 感谢反馈，请尽量填写完整，便于复现与定位。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰描述缺陷表现与预期行为
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 执行 '...'
        2. 输入 '...'
        3. 观察到 '...'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 错误日志、堆栈或截图。注意脱敏，勿包含密钥、cookie 等敏感信息
  - type: input
    id: env
    attributes:
      label: 版本与环境
      description: 版本号 / commit、操作系统、运行方式
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
